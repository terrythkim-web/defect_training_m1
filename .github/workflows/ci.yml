name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (M1). GitHub's Mac runners have no usable MPS GPU, so this is a
        # CPU functional test; speed and MPS are checked on a real Mac (docs/mac_checklist.md).
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Install CPU PyTorch (Linux, Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch (macOS, the PyPI wheel includes MPS)
        if: runner.os == 'macOS'
        run: python -m pip install torch torchvision

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Install MLX CPU build (Linux; numerics test of tools/mlx_yolo.py against PyTorch)
        if: runner.os == 'Linux'
        run: python -m pip install -e ".[bench]"

      - name: Run tests
        run: python -m pytest -v

      - name: Self-check (imports, model YAMLs, ONNX Runtime, Korean font, main window)
        run: python -m defect_inspection.app --self-check

  docker:
    # The development container of docs/docker_dev.md (CPU variant): image builds, tests pass inside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check compose file
        run: docker compose config -q

      - name: Build dev-cpu image
        run: docker compose build dev-cpu

      - name: Claude Code memory is seeded on the first start
        run: >
          docker compose run --rm -T dev-cpu
          bash -c 'ls "$CLAUDE_CONFIG_DIR/projects/-workspace/memory/MEMORY.md" && claude --version'

      - name: Tests and self-check inside the container
        run: >
          docker run --rm -v "$PWD:/workspace" -e QT_QPA_PLATFORM=offscreen defectlab-dev:cpu
          bash -c "python -m pytest -q -p no:cacheprovider && python -m defect_inspection.app --self-check"
